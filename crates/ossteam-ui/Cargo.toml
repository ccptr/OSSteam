[package]
name = "ossteam-ui"
description = "ossteam's GUI toolkit: winit windows, a Vulkan and a software renderer (ADR 0004)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
etagere = "0.2.15"
gpu-allocator = { version = "0.28.0", default-features = false, features = ["std", "vulkan"] }
raw-window-handle = "0.6.2"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
tracing.workspace = true
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }

# The desktop portal's colour scheme before the first frame (gui.md §6).
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "settings"] }
async-io = "2.6.0"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
