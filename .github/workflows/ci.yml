      #       target/release/ossteamd
      #       target/release/ossteam
      #       target/release/ossteam-gui
      #       target/release/ossteamd.exe
      #       target/release/ossteam.exe
      #       target/release/ossteam-gui.exe
      #       target/release/examples/spike
      #       target/release/examples/spike.exe
      #     if-no-files-found: error
