[package]
name = "ossteamd"
description = "ossteam per-user daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ossteam-auth.workspace = true
ossteam-content.workspace = true
ossteam-ipc.workspace = true
ossteam-net.workspace = true
ossteam-pics.workspace = true
ossteam-proto.workspace = true
ossteam-types.workspace = true
ossteam-vdf.workspace = true
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
ctrlc = { version = "3.5.2", features = ["termination"] }
directories.workspace = true
interprocess.workspace = true
keyring-core = "1.0.1"
rand_core.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process", "system"] }

# The OS keyrings (SPEC D-8). Secret Service is reached through libdbus,
# which is synchronous (SYNC-1); the zbus store would bring an async runtime.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

# The fake CM in src/testing (FAITH-4).
[dev-dependencies]
ossteam-content = { workspace = true, features = ["testing"] }
base64.workspace = true
prost.workspace = true
rand_core.workspace = true
rsa.workspace = true
