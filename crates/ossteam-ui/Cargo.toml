[package]
name = "ossteam-ui"
description = "ossteam's GUI toolkit: winit windows, a Vulkan and a software renderer (ADR 0004)"
version.workspace = true
edition.workspace = true
license = "LGPL-2.1-or-later"
publish.workspace = true

[dependencies]
# The clipboard off Wayland.
arboard = { version = "3.7.0", default-features = false }
ash = "0.38.0"
ash-window = "0.13.0"
# Without "fontconfig": `fonts.rs` reads fontconfig's configuration itself.
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
etagere = "0.2.15"
gpu-allocator = { version = "0.28.0", default-features = false, features = ["std", "vulkan"] }
raw-window-handle = "0.6.2"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# Layout (ADR 0004): flexbox only.
taffy = { version = "0.13.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
# The locale cosmic-text orders fallback fonts by (`text.rs`).
sys-locale = "0.3.2"
tracing.workspace = true
unicode-segmentation = "1.13.3"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
# A text field's buffer is wiped as it grows and goes (IPC-10: passwords).
zeroize.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# The desktop portal: the colour scheme before the first frame (gui.md §6)
# and the folder picker (`portal.rs`).
ossteam-dbus.workspace = true
smithay-clipboard = "0.7.3"

# The UI font and the font directories, from fontconfig's configuration
# (`fonts.rs`).
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
fontconfig-parser = { version = "0.5.8", default-features = false }

# The folder picker off Linux.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.17.2", default-features = false }

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber.workspace = true

# examples/wayland_ime.rs, an input method for testing IME on a compositor.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
# `portal.rs`'s tests run against its bus on a socket pair.
ossteam-dbus = { workspace = true, features = ["test-bus"] }
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }

[lints]
workspace = true
