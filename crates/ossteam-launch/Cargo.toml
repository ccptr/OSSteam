[package]
name = "ossteam-launch"
description = "Launch options, command lines, the launch environment, SteamStub detection, game processes and discovery entries"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ossteam-types.workspace = true
ossteam-vdf.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process", "system", "thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The reaper resets a signal's disposition before raising it (`launch.md` §4).
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The discovery service is a Mach service (`steamworks-abi.md` §1.3).
mach2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
