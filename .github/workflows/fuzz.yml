# SPEC SEC-5: fuzz the parsers nightly.
name: Fuzz

on:
  # RELEASE-BLOCKER: the nightly schedule builds on Linux, so it is off
  # during development. Reinstate it before any release; see
  # docs/release-checklist.md. Manual runs still work.
  # schedule:
  #   - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [vdf_text, vdf_binary, cm_packet, cm_multi]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
        working-directory: fuzz
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
