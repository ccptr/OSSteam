# SPEC §19.2: every PLAT-1 target, plus formatting, lints, licenses,
# layering and SPDX headers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt, deny, layering, SPDX
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo xtask check-layering
      - run: cargo xtask check-spdx
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # RELEASE-BLOCKER: Linux and Windows builds are off during
          # development (built and tested locally instead). Reinstate these
          # three entries before any release; see docs/release-checklist.md.
          # - { name: linux-x86_64, os: ubuntu-24.04 }
          # - { name: linux-aarch64, os: ubuntu-24.04-arm }
          # - { name: windows-x86_64, os: windows-2025 }
          - { name: macos-aarch64, os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # During development CI runs only check, clippy and test.
      # RELEASE-BLOCKER: reinstate the commented steps below (release
      # builds, artifact upload) before any release; see
      # docs/release-checklist.md.
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # - run: cargo build --release --workspace
      # - run: cargo build --release -p ossteam-gui --example spike
