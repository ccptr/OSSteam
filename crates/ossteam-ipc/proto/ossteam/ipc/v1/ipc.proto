// SPDX-License-Identifier: GPL-2.0-or-later
//
// ossteam client IPC protocol, version 1.
//
// This file is the public API for third-party clients. Framing, versioning
// and connection rules are in docs/spec/ipc.md. Within major version 1,
// changes only add fields, messages and methods; field numbers are never
// reused.

syntax = "proto3";

package ossteam.ipc.v1;

// One frame on the wire. Requests and their responses share `id`, which the
// client chooses and which is never 0. Events always have `id = 0`.
message Envelope {
  uint64 id = 1;
  oneof body {
    Hello hello = 2;
    Request request = 3;
    Response response = 4;
    Event event = 5;
    Error error = 6;
  }
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

enum PeerKind {
  PEER_KIND_UNSPECIFIED = 0;
  PEER_KIND_DAEMON = 1;
  PEER_KIND_CLI = 2;
  PEER_KIND_GUI = 3;
  PEER_KIND_OTHER = 4;
}

// The first frame in each direction. The client sends its Hello with id 0;
// the daemon answers with its own Hello, or with an Error and then closes
// the connection.
message Hello {
  ProtocolVersion protocol = 1;
  PeerKind kind = 2;
  // Program name, e.g. "ossteam" or "ossteam-gui".
  string name = 3;
  // Program version, e.g. "0.1.0".
  string version = 4;
}

// Stable error codes. Each maps to one CLI exit code (SPEC §15.3).
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // A malformed frame or a message that is not valid at this point.
  ERROR_CODE_PROTOCOL = 1;
  // The client's major protocol version is not supported. `detail` names
  // the supported range.
  ERROR_CODE_INCOMPATIBLE_VERSION = 2;
  ERROR_CODE_INVALID_ARGUMENT = 3;
  ERROR_CODE_NOT_LOGGED_IN = 4;
  ERROR_CODE_NOT_FOUND = 5;
  ERROR_CODE_NOT_OWNED = 6;
  // Honest "not implemented" (SPEC FAITH-2). Also returned for a request
  // method this daemon does not know.
  ERROR_CODE_UNSUPPORTED = 7;
  ERROR_CODE_CONFLICT = 8;
  ERROR_CODE_NETWORK = 9;
  ERROR_CODE_INTERNAL = 10;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  string detail = 3;
}

message Request {
  oneof method {
    GetStatusRequest get_status = 1;
    GetVersionRequest get_version = 2;
    ShutdownRequest shutdown = 3;
    SubscribeRequest subscribe = 4;
    UnsubscribeRequest unsubscribe = 5;
    LoginWithCredentialsRequest login_with_credentials = 6;
    LoginWithQrRequest login_with_qr = 7;
    SubmitGuardCodeRequest submit_guard_code = 8;
    CancelLoginRequest cancel_login = 9;
    LogoutRequest logout = 10;
    ListAccountsRequest list_accounts = 11;
    SwitchAccountRequest switch_account = 12;
    SetPersonaStateRequest set_persona_state = 13;
    ListAppsRequest list_apps = 14;
    GetAppRequest get_app = 15;
    GetSettingsRequest get_settings = 16;
    SetSettingRequest set_setting = 17;
    GetAssetRequest get_asset = 18;
    ListLibraryFoldersRequest list_library_folders = 19;
    AddLibraryFolderRequest add_library_folder = 20;
    RemoveLibraryFolderRequest remove_library_folder = 21;
    InstallRequest install = 22;
    UpdateRequest update = 23;
    VerifyRequest verify = 24;
    UninstallRequest uninstall = 25;
    ListJobsRequest list_jobs = 26;
    PauseJobRequest pause_job = 27;
    ResumeJobRequest resume_job = 28;
    CancelJobRequest cancel_job = 29;
    SetJobPriorityRequest set_job_priority = 30;
    GetLaunchOptionsRequest get_launch_options = 31;
    LaunchRequest launch = 32;
    ListRunningRequest list_running = 33;
    StopGameRequest stop_game = 34;
  }
}

message Response {
  oneof result {
    GetStatusResponse get_status = 1;
    GetVersionResponse get_version = 2;
    ShutdownResponse shutdown = 3;
    SubscribeResponse subscribe = 4;
    UnsubscribeResponse unsubscribe = 5;
    LoginStartedResponse login_with_credentials = 6;
    LoginStartedResponse login_with_qr = 7;
    SubmitGuardCodeResponse submit_guard_code = 8;
    CancelLoginResponse cancel_login = 9;
    LogoutResponse logout = 10;
    ListAccountsResponse list_accounts = 11;
    SwitchAccountResponse switch_account = 12;
    SetPersonaStateResponse set_persona_state = 13;
    ListAppsResponse list_apps = 14;
    GetAppResponse get_app = 15;
    GetSettingsResponse get_settings = 16;
    SetSettingResponse set_setting = 17;
    GetAssetResponse get_asset = 18;
    ListLibraryFoldersResponse list_library_folders = 19;
    AddLibraryFolderResponse add_library_folder = 20;
    RemoveLibraryFolderResponse remove_library_folder = 21;
    JobResponse install = 22;
    UpdateResponse update = 23;
    JobResponse verify = 24;
    JobResponse uninstall = 25;
    ListJobsResponse list_jobs = 26;
    JobResponse pause_job = 27;
    JobResponse resume_job = 28;
    JobResponse cancel_job = 29;
    JobResponse set_job_priority = 30;
    GetLaunchOptionsResponse get_launch_options = 31;
    LaunchResponse launch = 32;
    ListRunningResponse list_running = 33;
    StopGameResponse stop_game = 34;
  }
}

// --- Daemon ---------------------------------------------------------------

message GetStatusRequest {}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  // No connection to Steam exists and none is being attempted.
  CONNECTION_STATE_DISCONNECTED = 1;
  CONNECTION_STATE_CONNECTING = 2;
  CONNECTION_STATE_CONNECTED = 3;
}

message Account {
  fixed64 steam_id = 1;
  string account_name = 2;
  string persona_name = 3;
}

message GetStatusResponse {
  string daemon_version = 1;
  uint32 pid = 2;
  uint64 uptime_secs = 3;
  ConnectionState connection = 4;
  // The active account: the one logged on, or the one the daemon is
  // reconnecting (SPEC NET-4). Unset when there is none.
  Account account = 5;
  uint32 connected_clients = 6;
  uint32 active_jobs = 7;
  uint32 running_games = 8;
  // Whether `account` is logged on to Steam right now.
  bool logged_on = 9;
  // Why the session last ended or failed to resume, if it did.
  string session_reason = 10;
  // The active account's chosen persona state; unspecified without one.
  PersonaState persona_state = 11;
  // Linux: whether launched games get a private ~/.steam
  // (steamworks-abi.md §1.1.6). Unset off Linux.
  GameIsolation game_isolation = 12;
}

message GameIsolation {
  // Whether a private ~/.steam can be made for launched games (§1.1.2).
  bool available = 1;
  // Why not, when it cannot: the failed step, its error, and what the
  // daemon could read about why.
  string reason = 2;
  // Whether launches fail because of it: not available, the real
  // entries belong to an official client, and the daemon does not hold
  // them under discovery.take_over_official (§1.1.5).
  bool launches_blocked = 3;
  // Whether the daemon holds an official client's real entries under
  // discovery.take_over_official (§1.1.5).
  bool holds_official_entries = 4;
}

message GetVersionRequest {}

message GetVersionResponse {
  string daemon_version = 1;
  ProtocolVersion protocol = 2;
  // Rust target triple components, e.g. "linux" and "x86_64".
  string os = 3;
  string arch = 4;
}

message ShutdownRequest {
  // Stop even while games launched by the daemon are running (SPEC D-5).
  bool force = 1;
}

message ShutdownResponse {}

// --- Session (docs/spec/ipc.md §5.2) --------------------------------------

// Starts a credential login. The response arrives once Steam has accepted
// the start of the sign-in; LoginPrompt events and one LoginEnded follow on
// the SESSION topic. A login is owned by the connection that started it and
// is cancelled if that connection closes.
message LoginWithCredentialsRequest {
  string username = 1;
  // Sent only in this request and zeroed by both sides after use (IPC-10).
  string password = 2;
  // Store the refresh token so the session resumes after a restart.
  bool remember = 3;
}

message LoginWithQrRequest {
  bool remember = 1;
}

message LoginStartedResponse {}

enum LoginPromptKind {
  LOGIN_PROMPT_KIND_UNSPECIFIED = 0;
  // Enter the code Steam emailed; `hint` is the address's domain.
  LOGIN_PROMPT_KIND_EMAIL_CODE = 1;
  // Enter the code from the Steam mobile authenticator.
  LOGIN_PROMPT_KIND_DEVICE_CODE = 2;
  // Approve the sign-in in the Steam mobile app, or by the link in an
  // email when `hint` says so. Nothing needs to be submitted.
  LOGIN_PROMPT_KIND_DEVICE_CONFIRMATION = 3;
  // Show `qr_url` as a QR code. A later prompt with a new URL replaces it.
  LOGIN_PROMPT_KIND_QR_URL = 4;
}

// Answers an EMAIL_CODE or DEVICE_CODE prompt.
message SubmitGuardCodeRequest {
  string code = 1;
  // Which prompt this answers. Unspecified is accepted when the login
  // offers exactly one kind of code.
  LoginPromptKind kind = 2;
}

message SubmitGuardCodeResponse {}

message CancelLoginRequest {}

message CancelLoginResponse {}

// Logs the active account off and deletes its stored token.
message LogoutRequest {}

message LogoutResponse {}

message ListAccountsRequest {}

message ListAccountsResponse {
  // Accounts with a stored refresh token.
  repeated Account accounts = 1;
  // The active account's Steam id, or 0.
  fixed64 active = 2;
}

// Logs off the active account, if any, and logs on with the stored token of
// `steam_id`. The response arrives once that logon has succeeded or failed.
message SwitchAccountRequest {
  fixed64 steam_id = 1;
}

message SwitchAccountResponse {
  Account account = 1;
}

// What friends see (SPEC PLAY-2). Stored per account; the default is ONLINE.
enum PersonaState {
  PERSONA_STATE_UNSPECIFIED = 0;
  PERSONA_STATE_ONLINE = 1;
  PERSONA_STATE_INVISIBLE = 2;
  PERSONA_STATE_OFFLINE = 3;
}

// Sets the active account's persona state. It is sent to Steam at once when
// the account is logged on, and after every later logon.
message SetPersonaStateRequest {
  PersonaState state = 1;
}

message SetPersonaStateResponse {}

// --- Library (docs/spec/ipc.md §5.3) --------------------------------------

message ListAppsRequest {
  // Keeps apps whose name contains this text, ignoring case, or whose id it
  // is. A DLC that matches is listed under its parent. Empty keeps all.
  string filter = 1;
  // Only installed apps.
  bool installed_only = 2;
}

message AppSummary {
  uint32 app_id = 1;
  // Empty when the app's info is not available.
  string name = 2;
  // As Steam writes it: "Game", "DLC", "Application", ... Empty when the
  // app's info is not available.
  string type = 3;
  // For DLC: the app it belongs to; 0 otherwise.
  uint32 parent = 4;
  // Whether the app's info is available.
  bool has_info = 5;
  bool installed = 6;
  // The account's DLC for this app.
  repeated AppSummary dlc = 7;
  // Installed, and the branch has manifests other than the installed ones
  // (InstalledApp.update_available).
  bool update_available = 8;
}

message ListAppsResponse {
  // Top-level apps sorted by name, each with its DLC.
  repeated AppSummary apps = 1;
  // False while the license list or product info is still being fetched,
  // or after a fetch failed and is waiting for a retry.
  bool complete = 2;
  // Granted packages whose info is not available, so their apps are not
  // known.
  repeated uint32 packages_without_info = 3;
}

message GetAppRequest {
  uint32 app_id = 1;
}

message Depot {
  uint32 depot_id = 1;
  string name = 2;
  repeated string oslist = 3;
  string osarch = 4;
  string language = 5;
  // The DLC this depot belongs to; 0 for none.
  uint32 dlc_app_id = 6;
  // For a depot shared from another app: that app; 0 otherwise.
  uint32 from_app_id = 7;
  bool shared_install = 8;
  // 0 when not given.
  uint64 max_size = 9;
}

message Branch {
  string name = 1;
  // 0 when not given.
  uint32 build_id = 2;
  string description = 3;
  bool password_required = 4;
  // Unix time; 0 when not given.
  uint64 time_updated = 5;
}

// A launch option from the app's info (docs/spec/launch.md §1).
message LaunchOption {
  // The key under config/launch.
  uint32 index = 1;
  string executable = 2;
  string arguments = 3;
  // In the content language when the info translates it.
  string description = 4;
  string type = 5;
  repeated string oslist = 6;
  string osarch = 7;
  string betakey = 8;
  string working_dir = 9;
  // DLC the account must own.
  repeated uint32 owns_dlc = 10;
  string realm = 11;
  // Set by GetLaunchOptions only: the option can be launched on this OS,
  // branch and account.
  bool qualifies = 12;
}

message GetAppResponse {
  AppSummary app = 1;
  // The rest is empty when `app.has_info` is false.
  uint32 change_number = 2;
  // Steam limited the info because no access token was available.
  bool missing_token = 3;
  repeated string oslist = 4;
  string install_dir = 5;
  repeated Depot depots = 6;
  repeated Branch branches = 7;
  repeated LaunchOption launch_options = 8;
  // Unset when the app is not installed.
  InstalledApp installed = 9;
  // Linux: the app's compatibility tool; unset elsewhere and while the
  // tool list is not available.
  Compat compat = 10;
  // The last ShimReport sent for the app on the active account; unset when
  // there was none (docs/spec/gui.md §5).
  ShimReport last_shim_report = 11;
}

// docs/spec/compat-tools.md §8.
message Compat {
  // Unset when the app runs natively.
  CompatTool tool = 1;
  CompatSource source = 2;
  // The tool and the tools it requires, outermost first.
  repeated CompatChainTool chain = 3;
  repeated CompatChoice choices = 4;
  // The platform its depots are installed for; empty when not installed.
  string platform = 5;
}

message CompatTool {
  // Empty for a tool the list does not name.
  string name = 1;
  uint32 app_id = 2;
  string display_name = 3;
}

enum CompatSource {
  COMPAT_SOURCE_UNSPECIFIED = 0;
  COMPAT_SOURCE_USER = 1;
  // App 891390's mappings.
  COMPAT_SOURCE_VALVE = 2;
  // The app's own info.
  COMPAT_SOURCE_APP = 3;
  // The app has a Linux version.
  COMPAT_SOURCE_NATIVE = 4;
  // compat.default_tool.
  COMPAT_SOURCE_DEFAULT = 5;
}

message CompatChainTool {
  CompatTool tool = 1;
  bool installed = 2;
}

// A value for compat.tool.<app id>.
message CompatChoice {
  string name = 1;
  string display_name = 2;
}

// An installed app (docs/spec/content.md §8).
message InstalledApp {
  // The library folder's path.
  string folder = 1;
  // The absolute path of the app's files.
  string path = 2;
  string branch = 3;
  // The build installed; 0 when the branch gave none.
  uint32 build_id = 4;
  repeated InstalledDepot depots = 5;
  // The sum of the installed manifests' file sizes.
  uint64 size = 6;
  // The branch has manifests other than the installed ones
  // (docs/spec/content.md §10).
  bool update_available = 7;
}

message InstalledDepot {
  uint32 depot_id = 1;
  fixed64 manifest_id = 2;
  // For a depot installed into another app's directory: that app.
  uint32 shared_from = 3;
}

// An image of an app, as Steam's library and store show it.
enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  // The wide store header.
  ASSET_KIND_HEADER = 1;
  // The portrait library capsule.
  ASSET_KIND_CAPSULE = 2;
  // The wide image behind an app page's title, and its blurred version.
  ASSET_KIND_HERO = 3;
  ASSET_KIND_HERO_BLUR = 4;
  // The title logo drawn over the hero.
  ASSET_KIND_LOGO = 5;
}

// Fetches one of an app's images into the daemon's cache, unless it is
// there already, and answers with the file's path. Several requests for
// the same image share one download.
message GetAssetRequest {
  uint32 app_id = 1;
  AssetKind kind = 2;
  // Prefer the double-size image, where the app has one.
  bool high_dpi = 3;
}

message GetAssetResponse {
  // An absolute path to the image file. The daemon never changes the file
  // in place: a new version of the image goes to a new path, and the old
  // file may be deleted after that.
  string path = 1;
}

// --- Library folders (docs/spec/ipc.md §5.5) -------------------------------

message LibraryFolder {
  string path = 1;
  bool is_default = 2;
  // Whether the folder can be read now.
  bool available = 3;
  // Free space on the folder's file system; 0 when not available.
  uint64 free_bytes = 4;
  repeated uint32 app_ids = 5;
}

message ListLibraryFoldersRequest {}

message ListLibraryFoldersResponse {
  // The default folder first, then in the order they were added.
  repeated LibraryFolder folders = 1;
}

message AddLibraryFolderRequest {
  // Absolute.
  string path = 1;
}

message AddLibraryFolderResponse {
  LibraryFolder folder = 1;
}

message RemoveLibraryFolderRequest {
  string path = 1;
}

message RemoveLibraryFolderResponse {}

// --- Jobs (docs/spec/ipc.md §5.6) ------------------------------------------

enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  JOB_KIND_INSTALL = 1;
  JOB_KIND_UPDATE = 2;
  JOB_KIND_VERIFY = 3;
  JOB_KIND_UNINSTALL = 4;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_PAUSED = 3;
  JOB_STATE_DONE = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELLED = 6;
}

enum JobPhase {
  JOB_PHASE_UNSPECIFIED = 0;
  // Fetching depot keys and manifests, and deciding what to write.
  JOB_PHASE_PREPARING = 1;
  // Verify is hashing installed files.
  JOB_PHASE_CHECKING = 2;
  // Taking chunks from staging and installed files.
  JOB_PHASE_COPYING = 3;
  JOB_PHASE_DOWNLOADING = 4;
  // Links, deletions and recording the result.
  JOB_PHASE_FINISHING = 5;
}

message JobProgressInfo {
  JobPhase phase = 1;
  // File bytes the job writes and has written; while CHECKING, bytes to
  // hash and hashed.
  uint64 bytes_total = 2;
  uint64 bytes_done = 3;
  // Bytes to download as served, once known, and downloaded.
  uint64 download_total = 4;
  uint64 downloaded = 5;
  uint64 files_total = 6;
  uint64 files_done = 7;
}

message Job {
  uint64 job_id = 1;
  uint32 app_id = 2;
  JobKind kind = 3;
  JobState state = 4;
  int32 priority = 5;
  JobProgressInfo progress = 6;
  // Set when the job failed.
  Error error = 7;
  string folder = 8;
  string branch = 9;
  // Unix time.
  uint64 created = 10;
}

message JobResponse {
  Job job = 1;
}

message InstallRequest {
  uint32 app_id = 1;
  // Empty: the default folder.
  string folder = 2;
  // Empty: "public".
  string branch = 3;
}

message UpdateRequest {
  repeated uint32 app_ids = 1;
  // Every installed app with a known update.
  bool all = 2;
}

message UpdateResponse {
  repeated Job jobs = 1;
}

message VerifyRequest {
  uint32 app_id = 1;
}

message UninstallRequest {
  uint32 app_id = 1;
  // Linux: also delete <library>/compatdata/<app id>
  // (docs/spec/compat-tools.md §6.1).
  bool remove_compat_data = 2;
}

message ListJobsRequest {}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message PauseJobRequest {
  uint64 job_id = 1;
}

message ResumeJobRequest {
  uint64 job_id = 1;
}

message CancelJobRequest {
  uint64 job_id = 1;
}

message SetJobPriorityRequest {
  uint64 job_id = 1;
  int32 priority = 2;
}

// --- Settings (docs/spec/ipc.md §5.4) -------------------------------------

enum SettingKind {
  SETTING_KIND_UNSPECIFIED = 0;
  // Written "true" or "false".
  SETTING_KIND_BOOL = 1;
  // A decimal integer.
  SETTING_KIND_INTEGER = 2;
  // Text; Setting.description names the values allowed.
  SETTING_KIND_STRING = 3;
}

// Where a setting's value comes from. An override wins over the file, and
// the file over the default.
enum SettingSource {
  SETTING_SOURCE_UNSPECIFIED = 0;
  SETTING_SOURCE_DEFAULT = 1;
  // ossteamd.toml in the config directory.
  SETTING_SOURCE_FILE = 2;
  // Set with SetSetting and kept in the daemon's database.
  SETTING_SOURCE_OVERRIDE = 3;
}

message Setting {
  // Dotted, as in ossteamd.toml: "secrets.file_fallback".
  string key = 1;
  SettingKind kind = 2;
  // The value in effect, written the way SetSetting accepts it.
  string value = 3;
  SettingSource source = 4;
  string default_value = 5;
  // The value ossteamd.toml gives; empty when the file does not set it.
  string file_value = 6;
  string description = 7;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  // Every setting this daemon knows, sorted by key.
  repeated Setting settings = 1;
}

// Overrides one setting, or with `reset` removes its override so the file
// or the default applies again. `value` is ignored when `reset` is set.
message SetSettingRequest {
  string key = 1;
  string value = 2;
  bool reset = 3;
}

message SetSettingResponse {
  // The setting as it is now.
  Setting setting = 1;
}

// --- Events ---------------------------------------------------------------

enum Topic {
  TOPIC_UNSPECIFIED = 0;
  TOPIC_DAEMON = 1;
  TOPIC_SESSION = 2;
  TOPIC_LIBRARY = 3;
  TOPIC_JOBS = 4;
  TOPIC_GAMES = 5;
  TOPIC_NOTICES = 6;
}

message SubscribeRequest {
  repeated Topic topics = 1;
}

message SubscribeResponse {
  // Every topic the connection is subscribed to after the request.
  repeated Topic topics = 1;
}

message UnsubscribeRequest {
  repeated Topic topics = 1;
}

message UnsubscribeResponse {
  repeated Topic topics = 1;
}

message Event {
  oneof kind {
    Notice notice = 1;
    DaemonStopping daemon_stopping = 2;
    SessionChanged session_changed = 3;
    LoginPrompt login_prompt = 4;
    LoginEnded login_ended = 5;
    AppChanged app_changed = 6;
    SettingChanged setting_changed = 7;
    JobStateChanged job_state_changed = 8;
    JobProgress job_progress = 9;
    GameStarted game_started = 10;
    GameExited game_exited = 11;
    ShimReport shim_report = 12;
  }
}

enum NoticeLevel {
  NOTICE_LEVEL_UNSPECIFIED = 0;
  NOTICE_LEVEL_INFO = 1;
  NOTICE_LEVEL_WARNING = 2;
  NOTICE_LEVEL_ERROR = 3;
}

// Topic: NOTICES.
message Notice {
  NoticeLevel level = 1;
  string text = 2;
}

// Topic: DAEMON. Sent once, just before the daemon closes all connections.
message DaemonStopping {}

// Topic: SESSION. The connection or the active account changed. Carries the
// same fields as GetStatus.
message SessionChanged {
  ConnectionState connection = 1;
  Account account = 2;
  bool logged_on = 3;
  string reason = 4;
  // The stored token was rejected or is missing: the account must log in
  // again before it can be used.
  bool login_required = 5;
  PersonaState persona_state = 6;
}

// Topic: SESSION. Steam needs something from the user to continue a login.
message LoginPrompt {
  LoginPromptKind kind = 1;
  string hint = 2;
  string qr_url = 3;
}

// Topic: SESSION. A login finished: `account` on success, `error` otherwise.
// Sent once per login that got as far as LoginStartedResponse.
message LoginEnded {
  Account account = 1;
  Error error = 2;
}

// Topic: LIBRARY. These apps were added to or removed from the library, or
// their info changed. Clients read them again with ListApps or GetApp.
message AppChanged {
  repeated uint32 app_ids = 1;
  // Whether the library is complete now (ListAppsResponse.complete).
  bool complete = 2;
}

// Topic: DAEMON. A setting's value or source changed.
message SettingChanged {
  Setting setting = 1;
}

// Topic: JOBS. A job was created, or its state, priority or error changed.
message JobStateChanged {
  Job job = 1;
}

// Topic: JOBS. A running job's progress, at most ten times a second.
message JobProgress {
  uint64 job_id = 1;
  JobProgressInfo progress = 2;
}

// docs/spec/launch.md §8.
message GetLaunchOptionsRequest {
  uint32 app_id = 1;
}

message GetLaunchOptionsResponse {
  // Every option in the app's info, in index order, with `qualifies` set.
  repeated LaunchOption options = 1;
  // Exactly one option qualifies, so Launch needs no index.
  bool single = 2;
}

message LaunchRequest {
  uint32 app_id = 1;
  // The option's index. Unset launches the only option that qualifies.
  optional uint32 option = 2;
  // Appended to the option's arguments, each as one argument.
  repeated string extra_args = 3;
  // Launch even when an update is known.
  bool allow_stale = 4;
}

message RunningGame {
  uint32 app_id = 1;
  // The launch option's index.
  uint32 option = 2;
  // The process the daemon started: the reaper on Linux.
  uint32 pid = 3;
  // Unix time.
  uint64 started = 4;
  // Where the game's standard output and error go.
  string log = 5;
}

message LaunchResponse {
  RunningGame game = 1;
}

message ListRunningRequest {}

message ListRunningResponse {
  repeated RunningGame games = 1;
}

message StopGameRequest {
  uint32 app_id = 1;
}

message StopGameResponse {}

// Topic: GAMES. A game's process was created.
message GameStarted {
  RunningGame game = 1;
}

// Topic: GAMES. The last process of a game is gone.
message GameExited {
  uint32 app_id = 1;
  oneof status {
    // The exit code of the process the daemon started. On Windows, the
    // 32-bit exit code.
    int64 exit_code = 2;
    // The signal that ended it (Unix).
    int32 signal = 3;
  }
  // How long the game ran.
  uint64 seconds = 4;
}

// Topic: GAMES. What a game asked of the Steamworks library that ossteam
// does not provide (steamworks-abi.md §4). For a launched game, sent once
// just before its GameExited.
message ShimReport {
  uint32 app_id = 1;
  // For a launched game the pid the daemon started; otherwise the
  // process's own.
  uint32 pid = 2;
  bool launched = 3;
  // Interface versions handed out, in the order first seen.
  repeated string interfaces = 4;
  // Versions asked for that the library does not have.
  repeated string unknown_versions = 5;
  // Calls to unimplemented methods and exports, highest count first.
  repeated ShimCall unimplemented = 6;
}

message ShimCall {
  // An interface version string, or `exports`.
  string interface = 1;
  string method = 2;
  uint64 count = 3;
}
