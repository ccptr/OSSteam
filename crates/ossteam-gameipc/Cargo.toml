[package]
name = "ossteam-gameipc"
description = "ossteam game IPC protocol between the daemon and the Steamworks client library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The shim links this crate into every game: std and OS bindings only
# (SPEC WS-2).
[dependencies]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true
